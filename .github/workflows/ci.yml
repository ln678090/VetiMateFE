name: VetiMate FE CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-and-build:
    runs-on: ubuntu-latest

    # Thêm các biến môi trường giả lập tại đây để qua vòng check của Zod khi build
    env:
      NEXT_PUBLIC_API_URL: 'https://mock.local'
      NEXT_PUBLIC_APP_NAME: 'VetiMate FE'
      NEXT_TELEMETRY_DISABLED: 1 # Tắt luôn thông báo Telemetry của Next.js cho sạch log CI

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript & ESLint check & format check
        run: pnpm check-all

      - name: Build Next.js project
        run: pnpm build
